[workspace]
resolver = "2"
members = [
    "crates/alpha-flip-hot",
]

[workspace.package]
version = "3.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["Alpha-Flip Engineering Team"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/alpha-flip/alpha-flip"

[workspace.dependencies]
tokio = { version = "1.39", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
dotenvy = "0.15"
solana-sdk = { version = "1.18", default-features = false }
bs58 = "0.5"
async-trait = "0.1"
