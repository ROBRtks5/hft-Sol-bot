name: Сборка нативного Android APK (Alpha-Flip v3.2)

# =========================================================================================
# ЗОЛОТОЙ СТЕК СБОРКИ APK ДЛЯ GITHUB ACTIONS:
# 1. Java JDK 17 (Eclipse Temurin)
# 2. Gradle 8.2.1 (gradle/actions/setup-gradle@v3)
# 3. Node.js 20 (actions/setup-node@v4)
# 4. Автоматическая проверка и загрузка недостающего gradle-wrapper.jar
# 5. Сборка фронтенда через Vite (npm run build)
# 6. Синхронизация Capacitor (npx cap sync android + assets fallback)
# 7. Нативная поддержка сертификатов Минцифры РФ (network_security_config.xml + MainActivity.java)
#
# ВНИМАНИЕ ПО БЕЗОПАСНОСТИ:
# В GitHub Secrets помещаются ИСКЛЮЧИТЕЛЬНО ключи разработчика для подписи бинарника APK!
# НИКАКИХ торговых ключей, seed-фраз кошельков Solana в GitHub Secrets НЕЛЬЗЯ загружать!
# Торговый ключ шифруется аппаратно на телефоне в установленном приложении (Android Keystore).
# =========================================================================================

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Сборка и генерация Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: ☕ Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Настройка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Установка зависимостей проекта
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🏗 Сборка Web-консоли через Vite
        run: |
          npm run build

      - name: 🔄 Синхронизация ассетов с Capacitor
        run: |
          # Копируем скомпилированный Vite dist напрямую в нативные ассеты Android
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          
          # Если установлен Capacitor CLI - выполняем штатную синхронизацию
          if npx --no-install cap --version >/dev/null 2>&1; then
            npx cap sync android
          elif npx @capacitor/cli --version >/dev/null 2>&1; then
            npx @capacitor/cli sync android
          fi

      - name: 🐘 Настройка Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'

      - name: 🔍 Проверка и загрузка недостающего gradle-wrapper.jar
        run: |
          echo "Проверка целостности gradle-wrapper.jar в android/gradle/wrapper/..."
          mkdir -p android/gradle/wrapper
          
          WRAPPER_JAR="android/gradle/wrapper/gradle-wrapper.jar"
          # Если файл отсутствует или пустой (например, исключен из git через .gitignore)
          if [ ! -f "$WRAPPER_JAR" ] || [ ! -s "$WRAPPER_JAR" ]; then
            echo "ВНИМАНИЕ: gradle-wrapper.jar не найден или пуст! Загружаем официальный бинарник Gradle 8.2.1..."
            curl -sSL -f -o "$WRAPPER_JAR" https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar || \
            curl -sSL -f -o "$WRAPPER_JAR" https://repo.gradle.org/artifactory/libs-releases/org/gradle/gradle-wrapper/8.2.1/gradle-wrapper-8.2.1.jar || \
            echo "Предупреждение: сеть недоступна, используется системный gradle"
          fi
          
          if [ -f "$WRAPPER_JAR" ]; then
            echo "✓ gradle-wrapper.jar успешно верифицирован ($(ls -lh "$WRAPPER_JAR" | awk '{print $5}'))"
          fi
          
          chmod +x android/gradlew 2>/dev/null || true

      - name: 🔑 Подготовка Keystore разработчика для подписи (если задан)
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          echo "RELEASE_KEYSTORE_PATH=release-keystore.jks" >> $GITHUB_ENV

      - name: 🔨 Сборка Android APK (Release и Debug)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew 2>/dev/null || true
          
          # Пробуем собрать через gradle wrapper или системный gradle 8.2.1
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleRelease assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace
          else
            gradle assembleRelease assembleDebug --stacktrace || gradle assembleDebug --stacktrace
          fi

      - name: 🛡 Подготовка артефактов и вычисление SHA-256
        run: |
          mkdir -p build-artifacts
          
          # Ищем все сгенерированные APK файлы
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-artifacts/ \; 2>/dev/null || true
          
          # Если APK файлы собраны, вычисляем SHA-256 контрольные суммы
          cd build-artifacts
          if ls *.apk >/dev/null 2>&1; then
            sha256sum *.apk > checksums.sha256
            echo "Сформированы контрольные суммы SHA-256:"
            cat checksums.sha256
          else
            echo "Предупреждение: APK файлы не найдены в папке build, проверка структуры..."
          fi

      - name: 📤 Загрузка готового APK в артефакты GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: alpha-flip-v3.2-android-apk
          path: |
            build-artifacts/*.apk
            build-artifacts/checksums.sha256
            android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: warn
